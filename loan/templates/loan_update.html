<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update loan</title>
    {% include 'header.html' %}
  </head>
  <body>
    <div class="container">
      <h1>update Loan</h1>
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label for="loan_type">Loan Type</label>
          <!-- <select name="loan_type" id="loan_type" class="form-control" >
            <option value="{{loan.loan_type}}"></option>
            <option value="Loan">Loan</option>
            <option value="Advance salary">Advance Salary</option>
            
          </select> -->
          <select name="loan_type" id="loan_type" class="form-control" >
            <option value="" {% if loan.loan_type == "" %}selected{% endif %}></option>
            <option value="Loan" {% if loan.loan_type == "Loan" %}selected{% endif %}>Loan</option>
            <option value="Advance salary" {% if loan.loan_type == "Advance salary" %}selected{% endif %}>Advance Salary</option>
          </select>
        </div>
        <div class="form-group">
          <label for="loan_amount">Loan Amount</label>
          <input
            type="number"
            class="form-control"
            id="loan_amount"
            name="loan_amount"
            value="{{loan.loan_amount}}"
            
          />
        </div>
        <div class="form-group">
          <label for="repayment_type">Repayment type</label>
          <select
            name="repayment_type"
            id="repayment_type"
            class="form-control"
            
          >
          <option value="" {% if loan.repayment_type == "" %}selected{% endif %}></option>
          <option value="Monthly" {% if loan.repayment_type == "Monthly" %}selected{% endif %}>Monthly</option>
          </select>
          <!-- <input type="number" class="form-control" id="repayment_type" name="repayment_type" value={{loan.repayment_type}} > -->
        </div>
        <div class="form-group">
          <label for="method">Choose Repayment Method</label>
          <select name="method" id="method" class="form-control" >
            <option value="" {% if not loan.percentage_amount and not loan.fixed_amount %}selected{% endif %}></option>
            <option value="Percentage" {% if loan.percentage_amount %}selected{% endif %}>Percentage of Salary</option>
            <option value="Fixed" {% if loan.fixed_amount  %}selected{% endif %}>Fixed Amount</option>
          </select>
        </div>
        <div class="form-group">
          <label for="percentage_amount">Percentage salary</label>
          <input
            type="number"
            class="form-control"
            id="percentage_amount"
            name="percentage_amount"
            value="{{loan.percentage_amount}}"
            
          />
        </div>
        <div class="form-group">
          <label for="fixed_amount">Fixed amount</label>
          <input
            type="number"
            class="form-control"
            id="fixed_amount"
            name="fixed_amount"
            value="{{loan.fixed_amount}}"
            
          />
        </div>
        <div class="form-group">
          <label for="reasons">Reasons</label>
          <textarea
            class="form-control"
            id="reasons"
            name="reasons"
            rows="4"
            
          >
        {{loan.reasons}}</textarea
          >
        </div>
        <button type="submit" class="btn btn-success">Update loan</button>
        <a href="{% url 'loan_list_template' %}" class="btn btn-secondary"
          >Back</a
        >
      </form>
      <!-- <button class="btn btn-secondary"><a href="{% url 'loan_list_template' %}">Back</a></button> -->
    </div>

    <script>
        $(document).ready(function () {
          function toggleFieldsBasedOnLoanType() {
            var loan_type = $("#loan_type").val();
            if (loan_type === "Loan") {
              $("#repayment_type").closest(".form-group").show();
              $("#method").closest(".form-group").show();
              toggleFieldsBasedOnMethod(); 
            } else if (loan_type === "Advance salary") {
              $("#repayment_type").closest(".form-group").hide();
              $("#method").closest(".form-group").hide();
              $("#percentage_amount").closest(".form-group").hide();
              $("#fixed_amount").closest(".form-group").hide();
            } else {
              $("#repayment_type").closest(".form-group").show();
              $("#method").closest(".form-group").show();
              $("#percentage_amount").closest(".form-group").show();
              $("#fixed_amount").closest(".form-group").show();
            }
          }
      
          function toggleFieldsBasedOnMethod() {
            var method = $("#method").val();
            if (method === "Percentage") {
              $("#percentage_amount").closest(".form-group").show();
              $("#fixed_amount").closest(".form-group").hide();
            } else if (method === "Fixed") {
              $("#percentage_amount").closest(".form-group").hide();
              $("#fixed_amount").closest(".form-group").show();
            } else {
              $("#percentage_amount").closest(".form-group").show();
              $("#fixed_amount").closest(".form-group").show();
            }
          }
      
          toggleFieldsBasedOnLoanType();
      
          $("#loan_type").change(function () {
            toggleFieldsBasedOnLoanType();
          });
      
          $("#method").change(function () {
            toggleFieldsBasedOnMethod();
          });
        });
      </script>
  </body>
